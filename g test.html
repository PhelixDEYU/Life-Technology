<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>結構強度測試成績系統</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #34495e;
            --accent-color: #27ae60;
            --accent-hover: #2ecc71;
            --bg-color: #f4f7f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: #333;
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            font-size: clamp(1.5rem, 4vw, 2rem);
            margin-bottom: 20px;
        }

        .controls-container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .search-box {
            display: flex;
            align-items: center;
            flex: 1;
            min-width: 250px;
        }
        
        .search-box input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }

        .file-upload {
            flex: 1;
            min-width: 250px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 15px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
            flex: 1;
            white-space: nowrap;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .btn-export {
            background-color: #2980b9;
        }
        .btn-export:hover {
            background-color: #3498db;
        }

        .btn-clear {
            background-color: #e74c3c;
        }
        .btn-clear:hover {
            background-color: #c0392b;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
        }

        th, td {
            padding: 12px 10px;
            text-align: center;
            border-bottom: 1px solid #eee;
            vertical-align: middle;
        }

        th {
            background-color: var(--secondary-color);
            color: white;
            white-space: nowrap;
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
            width: 80px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-align: center;
            font-size: 16px;
        }
        
        input[type="number"]:focus {
            outline: 2px solid var(--accent-color);
            background-color: #e8f8f5;
        }

        .rank-1 { background-color: #fff8e1; font-weight: bold; }
        .rank-2 { background-color: #f5f5f5; font-weight: bold; }
        .rank-3 { background-color: #efebe9; font-weight: bold; }

        @media (max-width: 768px) {
            .control-row {
                flex-direction: column;
                align-items: stretch;
            }
            .button-group {
                flex-direction: column;
            }
            th, td {
                padding: 10px 5px;
                font-size: 14px;
            }
            input[type="number"] {
                width: 60px;
            }
        }
    </style>
</head>
<body>

    <h1>🏆 結構強度測試成績系統</h1>

    <div class="controls-container">
        <div class="control-row">
            <div class="file-upload">
                <label for="excelFileInput"><strong>匯入學生名單 (Excel):</strong> </label>
                <input type="file" id="excelFileInput" accept=".xlsx, .xls">
            </div>
            
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 輸入完整姓名或組別 (如: 5, 王小明)..." onkeyup="filterTable()">
            </div>
        </div>

        <div class="control-row" style="justify-content: flex-end;">
            <div class="button-group">
                <button onclick="calculateAndRank()">📊 計算成績與排名</button>
                <button class="btn-export" onclick="exportToExcel()">📥 匯出成績檔</button>
                <button class="btn-clear" onclick="clearData()">🗑️ 清除所有資料</button>
            </div>
        </div>
    </div>

    <div class="table-responsive">
        <table id="scoreTable">
            <thead>
                <tr>
                    <th>排名</th>
                    <th>組別</th>
                    <th>組員名單</th>
                    <th>承受載重 (g)</th>
                    <th>塔重 (g)</th>
                    <th>載重比</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="6" style="text-align:center; color:#999; padding: 30px;">請先匯入 Excel 學生名單</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        let groupData = [];
        const STORAGE_KEY = 'structuralTestGroupData';

        function saveToLocalStorage() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(groupData));
        }

        function loadFromLocalStorage() {
            const savedData = localStorage.getItem(STORAGE_KEY);
            if (savedData) {
                try {
                    groupData = JSON.parse(savedData);
                    renderTable();
                } catch (e) {
                    console.error("讀取存檔失敗", e);
                }
            }
        }

        window.addEventListener('DOMContentLoaded', loadFromLocalStorage);

        document.getElementById('excelFileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                const jsonData = XLSX.utils.sheet_to_json(worksheet, {header: 1});
                
                parseExcelData(jsonData);
            };
            
            reader.readAsArrayBuffer(file);
            e.target.value = ''; 
        });

        function parseExcelData(data) {
            if (data.length < 2) {
                alert("Excel 檔案內容為空或格式不正確！");
                return;
            }

            const headers = data[0] || [];
            let groupIdx = -1;
            let nameIdx = -1;

            for (let i = 0; i < headers.length; i++) {
                if (!headers[i]) continue;
                const headerStr = headers[i].toString().trim();
                
                if (headerStr.includes('分組') || headerStr.includes('組別') || headerStr.includes('組')) {
                    groupIdx = i;
                }
                if (headerStr.includes('姓名')) {
                    nameIdx = i;
                }
            }

            if (groupIdx === -1 || nameIdx === -1) {
                alert("找不到「姓名」或「分組」欄位，請檢查 Excel 的第一列標題名稱！");
                return;
            }

            const groupMap = {}; 
            
            for (let i = 1; i < data.length; i++) {
                const row = data[i];
                if (!row || row.length === 0) continue;
                
                const groupName = row[groupIdx] ? row[groupIdx].toString().trim() : '';
                const studentName = row[nameIdx] ? row[nameIdx].toString().trim() : '';
                
                if (!groupName) continue; 
                
                if (!groupMap[groupName]) {
                    groupMap[groupName] = {
                        groupName: groupName,
                        membersArr: [], 
                        towerWeight: 0,
                        payload: 0,
                        ratio: 0,
                        rank: '-'
                    };
                }
                
                if (studentName) {
                    groupMap[groupName].membersArr.push(studentName);
                }
            }

            groupData = Object.values(groupMap).map((group, index) => {
                return {
                    id: index,
                    groupName: group.groupName,
                    members: group.membersArr.join('、'), 
                    towerWeight: group.towerWeight,
                    payload: group.payload,
                    ratio: group.ratio,
                    rank: group.rank
                };
            });

            groupData.sort((a, b) => {
                const numA = parseInt(a.groupName.replace(/\D/g, '')) || 0;
                const numB = parseInt(b.groupName.replace(/\D/g, '')) || 0;
                return numA - numB;
            });

            saveToLocalStorage(); 
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            if (groupData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#999; padding: 30px;">請先匯入 Excel 學生名單</td></tr>';
                return;
            }

            groupData.forEach((data) => {
                const tr = document.createElement('tr');
                tr.id = `row_${data.id}`; 
                
                if (data.rank === 1) tr.className = 'rank-1';
                else if (data.rank === 2) tr.className = 'rank-2';
                else if (data.rank === 3) tr.className = 'rank-3';

                // 這裡的順序調整為：載重 -> 塔重
                tr.innerHTML = `
                    <td>${data.rank}</td>
                    <td>${data.groupName}</td>
                    <td>${data.members}</td>
                    <td><input type="number" id="payload_${data.id}" value="${data.payload || ''}"></td>
                    <td><input type="number" id="weight_${data.id}" value="${data.towerWeight || ''}"></td>
                    <td id="ratio_${data.id}">${data.ratio > 0 ? data.ratio.toFixed(2) : '-'}</td>
                `;
                tbody.appendChild(tr);
            });

            filterTable();
        }

        document.getElementById('tableBody').addEventListener('keydown', function(e) {
            if (e.target.tagName === 'INPUT' && e.target.type === 'number') {
                if (e.key === 'Enter') {
                    e.preventDefault(); 
                    updateDataFromInput(e.target);

                    const inputs = Array.from(document.querySelectorAll('#tableBody tr:not([style*="display: none"]) input[type="number"]'));
                    const currentIndex = inputs.indexOf(e.target);
                    
                    if (currentIndex >= 0 && currentIndex < inputs.length - 1) {
                        inputs[currentIndex + 1].focus();
                        inputs[currentIndex + 1].select(); 
                    } else if (currentIndex === inputs.length - 1) {
                        e.target.blur(); 
                        calculateAndRank(); 
                    }
                }
            }
        });

        document.getElementById('tableBody').addEventListener('blur', function(e) {
            if (e.target.tagName === 'INPUT' && e.target.type === 'number') {
                updateDataFromInput(e.target);
            }
        }, true);

        function updateDataFromInput(inputElem) {
            const idParts = inputElem.id.split('_'); 
            const fieldType = idParts[0]; 
            const rowId = parseInt(idParts[1]);

            const group = groupData.find(g => g.id === rowId);
            if (group) {
                if (fieldType === 'weight') {
                    group.towerWeight = parseFloat(inputElem.value) || 0;
                } else if (fieldType === 'payload') {
                    group.payload = parseFloat(inputElem.value) || 0;
                }

                if (group.towerWeight > 0) {
                    group.ratio = group.payload / group.towerWeight;
                } else {
                    group.ratio = 0;
                }

                const ratioTd = document.getElementById(`ratio_${rowId}`);
                if (ratioTd) {
                    ratioTd.textContent = group.ratio > 0 ? group.ratio.toFixed(2) : '-';
                }

                saveToLocalStorage(); 
            }
        }

        function filterTable() {
            const searchInput = document.getElementById('searchInput').value.trim();
            
            groupData.forEach((data) => {
                const tr = document.getElementById(`row_${data.id}`);
                if (!tr) return;

                if (searchInput === '') {
                    tr.style.display = '';
                    return;
                }

                let isMatch = false;
                const isNumericSearch = /^\d+$/.test(searchInput);

                if (isNumericSearch) {
                    const numStr = parseInt(searchInput, 10).toString();
                    const regex = new RegExp(`(^|[^0-9])0*${numStr}([^0-9]|$)`);
                    if (regex.test(data.groupName) || regex.test(data.members)) {
                        isMatch = true;
                    }
                } else {
                    const membersArray = data.members.split('、'); 
                    if (data.groupName === searchInput || membersArray.includes(searchInput)) {
                        isMatch = true;
                    }
                }

                if (isMatch) {
                    tr.style.display = '';
                } else {
                    tr.style.display = 'none';
                }
            });
        }

        function calculateAndRank() {
            if(groupData.length === 0) return;

            groupData.forEach((data) => {
                const weightInput = document.getElementById(`weight_${data.id}`);
                const payloadInput = document.getElementById(`payload_${data.id}`);
                
                if (weightInput && payloadInput) {
                    data.towerWeight = parseFloat(weightInput.value) || 0;
                    data.payload = parseFloat(payloadInput.value) || 0;
                }
                
                if (data.towerWeight > 0) {
                    data.ratio = data.payload / data.towerWeight;
                } else {
                    data.ratio = 0;
                }
            });

            groupData.sort((a, b) => b.ratio - a.ratio);

            let currentRank = 1;
            for (let i = 0; i < groupData.length; i++) {
                if (groupData[i].ratio === 0) {
                    groupData[i].rank = '-';
                    continue;
                }
                
                if (i > 0 && groupData[i].ratio === groupData[i-1].ratio) {
                    groupData[i].rank = groupData[i-1].rank;
                } else {
                    groupData[i].rank = currentRank;
                }
                currentRank++;
            }

            saveToLocalStorage(); 
            renderTable();
        }

        function exportToExcel() {
            if (groupData.length === 0) {
                alert("目前沒有資料可以匯出喔！請先匯入名單。");
                return;
            }

            calculateAndRank();

            const exportFormatData = groupData.map(data => {
                return {
                    "排名": data.rank,
                    "組別": data.groupName,
                    "組員名單": data.members,
                    "承受載重 (克)": data.payload > 0 ? data.payload : "未輸入",
                    "塔重 (克)": data.towerWeight > 0 ? data.towerWeight : "未輸入",
                    "載重比": data.ratio > 0 ? parseFloat(data.ratio.toFixed(2)) : "-"
                };
            });

            const worksheet = XLSX.utils.json_to_sheet(exportFormatData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "結構測試成績");
            XLSX.writeFile(workbook, "結構強度測試成績紀錄.xlsx");
        }

        function clearData() {
            if (confirm("確定要清除目前所有的測試成績與名單嗎？（換班級前適用）")) {
                groupData = [];
                localStorage.removeItem(STORAGE_KEY); 
                document.getElementById('excelFileInput').value = '';
                document.getElementById('searchInput').value = '';
                renderTable();
            }
        }
    </script>
</body>
</html>
